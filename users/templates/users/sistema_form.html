{% extends 'base.html' %}
{% block content %}
<h1 class="text-2xl font-bold mb-4">{% if editando %}Editar Sistema{% else %}Adicionar Sistema{% endif %}</h1>

<form method="post" class="space-y-6">
    {% csrf_token %}
    {% for field in form %}
        <div>
            <label class="block text-gray-700 font-semibold mb-2">{{ field.label }}</label>
            {{ field }}
            {% if field.errors %}
                <p class="text-red-500 text-sm mt-1">{{ field.errors|striptags }}</p>
            {% endif %}
        </div>
    {% endfor %}

    <div class="flex justify-end space-x-2 mt-6">
        <a href="{% url 'painel_sistemas' %}" class="px-4 py-2 rounded bg-gray-300 hover:bg-gray-400 text-gray-800 font-semibold">Cancelar</a>
        <button type="submit" class="px-4 py-2 rounded bg-blue-600 hover:bg-blue-700 text-white font-semibold">
            {% if editando %}Atualizar{% else %}Salvar{% endif %}
        </button>
    </div>
</form>
{% endblock %}
