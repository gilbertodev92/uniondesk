{% load static %}
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Union Desk</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Fonte -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">

    <!-- Font Awesome (ícones) -->
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
          crossorigin="anonymous" referrerpolicy="no-referrer"/>

<style>
        :root {
            --bg-main: #020617;
            --bg-card: #0b1220;
            --green: #22c55e;
            --green-soft: rgba(34,197,94,.15);
            --text-main: #e5e7eb;
            --text-muted: #9ca3af;
            --border: rgba(34,197,94,.25);
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: 'Inter', sans-serif;
            color: var(--text-main);
            background:
                radial-gradient(circle at top, rgba(34,197,94,.12), transparent 40%),
                radial-gradient(circle at bottom, rgba(34,197,94,.08), transparent 40%),
                var(--bg-main);
        }

        a { text-decoration: none; color: inherit; }

        /* HEADER */
        .topbar {
            height: 56px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 28px;
            background: linear-gradient(90deg, #020617, #020617cc);
            border-bottom: 1px solid var(--border);
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: 700;
            color: var(--green);
        }

        .logo i { font-size: 1.1rem; }

        .actions a {
            margin-left: 18px;
            font-size: .9rem;
            color: var(--text-muted);
            transition: color 0.2s;
        }

        .actions a:hover { color: var(--green); }

        /* CONTEÚDO */
        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 40px 26px;
        }

        h1 {
            font-size: 1.6rem;
            font-weight: 600;
            margin-bottom: 6px;
            color: var(--green);
        }

        .subtitle {
            color: var(--text-muted);
            font-size: .95rem;
            margin-bottom: 26px;
        }

        .search {
            max-width: 420px;
            margin-bottom: 36px;
        }

        .search input {
            width: 100%;
            padding: 12px 16px;
            border-radius: 12px;
            border: 1px solid var(--border);
            background: #020617;
            color: var(--text-main);
            outline: none;
            transition: border-color 0.2s;
        }

        .search input:focus { border-color: var(--green); }
        .search input::placeholder { color: var(--text-muted); }

        /* GRID DOS CARDS */
        .modules {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
            gap: 26px;
        }

        .card {
            background: linear-gradient(180deg, #0b1220, #020617);
            border-radius: 18px;
            padding: 28px 22px;
            border: 1px solid var(--border);
            transition: all .25s ease;
            position: relative;
            overflow: hidden;
            height: 100%;
        }

        .card::before {
            content: "";
            position: absolute;
            inset: 0;
            background: radial-gradient(circle at top, var(--green-soft), transparent 65%);
            opacity: 0;
            transition: .3s;
        }

        .card:hover::before { opacity: 1; }

        .card:hover {
            transform: translateY(-6px);
            border-color: var(--green);
            box-shadow: 0 0 28px rgba(34,197,94,.25);
        }

        .icon {
            width: 56px;
            height: 56px;
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(34,197,94,.12);
            color: var(--green);
            font-size: 1.6rem;
            margin-bottom: 18px;
        }

        .card p {
            font-size: .95rem;
            font-weight: 600;
            line-height: 1.3;
        }

        footer {
            text-align: center;
            font-size: .8rem;
            color: var(--text-muted);
            padding: 24px 0;
            border-top: 1px solid var(--border);
            margin-top: 50px;
        }

       
        
        /* Monitores Corporativos / Notebooks pequenos (até 1024px) */
        @media (max-width: 1024px) {
            .container { padding: 30px 20px; }
            h1 { font-size: 1.4rem; }
            .subtitle { font-size: 0.9rem; margin-bottom: 20px; }
            .search { margin-bottom: 26px; }
            
            /* Encolhe a grade e as caixas */
            .modules { grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 20px; }
            .card { padding: 22px 18px; border-radius: 14px; }
            .icon { width: 48px; height: 48px; font-size: 1.3rem; margin-bottom: 14px; }
            .card p { font-size: 0.9rem; }
        }

        /* Tablets e Celulares (até 768px) */
        @media (max-width: 768px) {
            .topbar { padding: 0 16px; height: 50px; }
            .logo { font-size: 0.9rem; }
            .actions a { margin-left: 12px; font-size: 0.8rem; }
            
            .container { padding: 20px 16px; }
            h1 { font-size: 1.25rem; }
            .subtitle { font-size: 0.85rem; }
            
            /* Caixas bem menores para não ocupar a tela toda */
            .modules { grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 16px; }
            .card { padding: 18px 14px; border-radius: 12px; }
            .icon { width: 40px; height: 40px; font-size: 1.1rem; margin-bottom: 12px; border-radius: 10px; }
            .card p { font-size: 0.85rem; }
        }
    </style>
</head>

<body>

<!-- HEADER -->
<div class="topbar">
    <div class="logo">
        <i class="fa-solid fa-layer-group"></i>
        Union Desk
    </div>
    <div class="actions">
        <a href="{% url 'home' %}">Home</a>
        <a href="{% url 'user_logout' %}">Sair</a>
    </div>
</div>

<!-- CONTEÚDO -->
<div class="container">
    <h1>Aplicações · Área de Trabalho</h1>
    <div class="subtitle">Acesse os módulos do Union Desk com um clique.</div>

    <div class="search">
        <input type="text" placeholder="Buscar módulos…">
    </div>

    <div class="modules">
        {% for modulo in modulos %}
        <a href="{{ modulo.url }}">
            <div class="card">
                <div class="icon">
                    <i class="{{ modulo.icon }}"></i>
                </div>
                <p>{{ modulo.nome }}</p>
            </div>
        </a>
        {% endfor %}
    </div>
</div>

<footer>
    © Union Desk
</footer>

</body>
</html>
