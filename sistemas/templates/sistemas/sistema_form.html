{% extends "base.html" %}
{% load static %}

{% block content %}
<div class="min-h-screen bg-gray-100 p-8">
    <div class="max-w-2xl mx-auto bg-white shadow-lg rounded-lg p-6">

        <h1 class="text-2xl font-bold text-gray-800 mb-6">
            {% if form.instance.pk %} Editar Sistema {% else %} Novo Sistema {% endif %}
        </h1>

        <form method="post" class="space-y-4">
            {% csrf_token %}
            {{ form.as_p }}

            <div class="flex justify-between">
                <a href="{% url 'painel_sistemas' %}" 
                   class="bg-gray-500 hover:bg-gray-700 text-white font-bold py-2 px-6 rounded transition">
                    Cancelar
                </a>
                <button type="submit" 
                        class="bg-blue-500 hover:bg-blue-700 text-white font-bold py-2 px-6 rounded transition">
                    Salvar
                </button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
