{% load static %}
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Union Desk</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Fonte moderna -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-main: #0b0f0d;
            --bg-header: #020617;
            --bg-card: #111827;

            --green: #22c55e;
            --green-soft: rgba(34,197,94,0.15);

            --text-main: #e5e7eb;
            --text-muted: #9ca3af;

            --border-glow: rgba(34,197,94,0.35);
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: 'Inter', Arial, sans-serif;
            color: var(--text-main);
            background:
                radial-gradient(circle at top, rgba(34,197,94,0.08), transparent 40%),
                radial-gradient(circle at bottom, rgba(34,197,94,0.05), transparent 40%),
                var(--bg-main);
        }

        a {
            color: inherit;
            text-decoration: none;
        }

        /* HEADER */
        header {
            height: 64px;
            background: linear-gradient(90deg, #0b1220, var(--bg-header));
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 32px;
            border-bottom: 1px solid rgba(34,197,94,0.2);
        }

        header h1 {
            margin: 0;
            font-size: 1.1rem;
            font-weight: 700;
            color: var(--green);
            letter-spacing: 1px;
        }

        header nav a {
            margin-left: 20px;
            font-size: 0.9rem;
            color: var(--text-muted);
            transition: color 0.2s;
        }

        header nav a:hover {
            color: var(--green);
        }

        /* CONTEÚDO */
        main {
            max-width: 1400px;
            margin: 0 auto;
            padding: 40px 25px;
        }
    </style>
</head>

<body>

<header>
    <h1>Union Desk</h1>
    <nav>
        <a href="{% url 'home' %}">Home</a>
        <a href="{% url 'logout' %}">Sair</a>
    </nav>
</header>

<main>
    {% block content %}
    {% endblock %}
</main>

</body>
</html>
