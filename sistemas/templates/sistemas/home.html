{% extends "base.html" %}
{% load static %}

{% block content %}

<style>
  :root {
    --green: #22c55e;
    --green-soft: rgba(34,197,94,0.15);
    --border-glow: rgba(34,197,94,0.35);
  }

  .ud-bg {
    background:
      radial-gradient(circle at top, rgba(34,197,94,0.08), transparent 40%),
      radial-gradient(circle at bottom, rgba(34,197,94,0.05), transparent 40%);
  }

  .ud-card {
    background: linear-gradient(180deg, #111827, #0b1220);
    border: 1px solid rgba(34,197,94,0.2);
    border-radius: 18px;
    transition: all .25s ease;
    position: relative;
    overflow: hidden;
  }

  .ud-card::before {
    content: "";
    position: absolute;
    inset: 0;
    background: radial-gradient(circle at top, var(--green-soft), transparent 65%);
    opacity: 0;
    transition: opacity .3s;
  }

  .ud-card:hover::before {
    opacity: 1;
  }

  .ud-card:hover {
    transform: translateY(-6px) scale(1.02);
    border-color: var(--green);
    box-shadow:
      0 0 30px var(--border-glow),
      inset 0 0 25px rgba(34,197,94,.12);
  }
</style>

<div class="ud-bg rounded-xl p-6">

  <!-- Título -->
  <div class="mb-6">
    <h1 class="text-2xl font-semibold text-emerald-400 tracking-wide">
      Aplicações · Área de Trabalho
    </h1>
    <p class="text-sm text-slate-400">
      Acesse os módulos do Union Desk com um clique.
    </p>
  </div>

  <!-- Grid -->
  <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6">

    {% for modulo in modulos %}
    <a href="{{ modulo.url }}" class="group">
      <div class="ud-card p-6 text-center">
        <img src="{{ modulo.img }}"
             alt="{{ modulo.nome }}"
             class="mx-auto mb-4 w-14 drop-shadow-[0_0_8px_rgba(34,197,94,0.35)]">
        <p class="text-sm font-semibold tracking-wide text-slate-100">
          {{ modulo.nome }}
        </p>
      </div>
    </a>
    {% endfor %}

  </div>

</div>

{% endblock %}
