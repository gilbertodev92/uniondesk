{% extends "base.html" %}
{% block title %}Cofre de Senhas{% endblock %}

{% block content %}
<div class="cv-root">
  <div class="cv-card">

    <div class="cv-brand">
      <div class="cv-brand__icon" aria-hidden="true">
        <i class="fa-solid fa-shield-halved"></i>
      </div>
      <h1 class="cv-brand__title">Cofre de Senhas</h1>
      <p class="cv-brand__sub">Ambiente criptografado • Lógica</p>
    </div>

    <form id="cv-form" autocomplete="off">
      {% csrf_token %}
      <label for="cv-pin" class="cv-label">PIN de acesso</label>
      <input type="password" id="cv-pin" class="cv-pin"
             inputmode="numeric" maxlength="6" placeholder="••••••"
             autocomplete="off" aria-describedby="cv-error">

      <button type="submit" id="cv-btn" class="cv-btn">
        <i class="fa-solid fa-unlock-keyhole"></i> <span>Desbloquear acesso</span>
      </button>
    </form>

    <p id="cv-error" class="cv-error" role="alert" aria-live="polite"></p>
  </div>
</div>

<style>
.cv-root {
    min-height: calc(100vh - 120px);
    display: flex; align-items: center; justify-content: center;
    padding: 24px 16px;
}
.cv-card {
    width: 100%; max-width: 400px; text-align: center;
    background: rgb(var(--c-panel));
    border: 1px solid rgb(var(--c-line));
    border-radius: 22px;
    padding: 38px 32px 30px;
    transition: background-color .25s, border-color .25s;
}

.cv-brand { margin-bottom: 28px; }
.cv-brand__icon {
    width: 76px; height: 76px; margin: 0 auto 18px;
    display: flex; align-items: center; justify-content: center;
    background: rgb(var(--c-accent) / .1);
    border: 1px solid rgb(var(--c-accent) / .28);
    border-radius: 22px;
    color: rgb(var(--c-accent)); font-size: 32px;
}
.cv-brand__title { font-size: 19px; font-weight: 800; color: rgb(var(--c-ink)); }
.cv-brand__sub {
    font-size: 9.5px; font-weight: 700; text-transform: uppercase;
    letter-spacing: .22em; color: rgb(var(--c-ink-faint)); margin-top: 7px;
}

.cv-label {
    display: block; text-align: left;
    font-size: 10px; font-weight: 800; text-transform: uppercase;
    letter-spacing: .14em; color: rgb(var(--c-ink-faint)); margin-bottom: 8px;
}
.cv-pin {
    width: 100%; height: 60px;
    background: rgb(var(--c-deep));
    border: 1px solid rgb(var(--c-line));
    border-radius: 14px;
    text-align: center;
    font-family: 'JetBrains Mono', monospace;
    font-size: 26px; font-weight: 700; letter-spacing: .45em; text-indent: .45em;
    color: rgb(var(--c-accent));
    outline: none; transition: border-color .15s, box-shadow .15s;
}
.cv-pin::placeholder { color: rgb(var(--c-ink-faint) / .5); letter-spacing: .3em; }
.cv-pin:focus { border-color: rgb(var(--c-accent)); box-shadow: 0 0 0 3px rgb(var(--c-accent) / .16); }
.cv-pin--error { border-color: rgb(var(--c-danger)) !important; animation: cv-shake .4s; }
@keyframes cv-shake {
    0%,100% { transform: translateX(0); }
    25% { transform: translateX(-6px); }
    75% { transform: translateX(6px); }
}
@media (prefers-reduced-motion: reduce) { .cv-pin--error { animation: none; } }

.cv-btn {
    width: 100%; margin-top: 16px; padding: 15px;
    display: flex; align-items: center; justify-content: center; gap: 10px;
    background: rgb(var(--c-accent));
    border: 1px solid rgb(var(--c-accent));
    border-radius: 14px; color: #fff;
    font-family: 'Inter', sans-serif;
    font-size: 11.5px; font-weight: 800;
    text-transform: uppercase; letter-spacing: .12em;
    cursor: pointer; transition: filter .15s;
}
.cv-btn:hover { filter: brightness(1.1); }
.cv-btn:disabled { opacity: .6; cursor: not-allowed; }

.cv-error {
    margin-top: 16px; min-height: 20px;
    font-size: 11px; font-weight: 700;
    text-transform: uppercase; letter-spacing: .08em;
    color: rgb(var(--c-danger));
}
</style>

<script>
(function () {
    "use strict";

    const form  = document.getElementById('cv-form');
    const input = document.getElementById('cv-pin');
    const btn   = document.getElementById('cv-btn');
    const erro  = document.getElementById('cv-error');

    input.focus();

    function getCookie(name) {
        const m = document.cookie.match('(^|;)\\s*' + name + '\\s*=\\s*([^;]+)');
        return m ? decodeURIComponent(m.pop()) : '';
    }

    function resetBtn() {
        btn.disabled = false;
        btn.innerHTML = '<i class="fa-solid fa-unlock-keyhole"></i> <span>Desbloquear acesso</span>';
    }

    function falhar(msg) {
        erro.textContent = msg;
        input.classList.add('cv-pin--error');
        setTimeout(() => input.classList.remove('cv-pin--error'), 450);
        input.value = '';
        input.focus();
        resetBtn();
    }

    form.addEventListener('submit', async function (e) {
        e.preventDefault();
        erro.textContent = '';

        const pin = input.value.trim();
        if (!pin) { falhar('PIN obrigatório'); return; }

        btn.disabled = true;
        btn.innerHTML = '<i class="fa-solid fa-circle-notch fa-spin"></i> <span>Validando...</span>';

        try {
            // CSRF agora é obrigatório: o @csrf_exempt foi removido da view.
            const resp = await fetch("{% url 'cofre_senhas:unlock_pin' %}", {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'X-CSRFToken': getCookie('csrftoken'),
                    'X-Requested-With': 'XMLHttpRequest',
                },
                body: JSON.stringify({ pin: pin }),
            });

            // 429 = excedeu tentativas (rate limit novo)
            if (resp.status === 429) {
                const d = await resp.json();
                const min = Math.ceil((d.retry_in || 300) / 60);
                falhar(`Muitas tentativas. Aguarde ${min} min.`);
                btn.disabled = true;
                return;
            }

            if (resp.status === 403) { falhar('PIN incorreto'); return; }
            if (!resp.ok) { falhar('Falha na autenticação'); return; }

            window.location.href = "{% url 'cofre_senhas:list' %}";

        } catch (err) {
            falhar('Erro de conexão');
        }
    });
})();
</script>
{% endblock %}
